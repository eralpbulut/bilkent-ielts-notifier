name: Bilkent IELTS Monitor

on:
  schedule:
    - cron: "2-59/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilkent-ielts-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereken paketleri kur
        run: pip install requests beautifulsoup4

      - name: Bilkent IELTS sayfasını kontrol et
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ielts_checker.py
        
      - name: Yeni durumu kaydet
        run: |
          git config user.name "bilkent-ielts-bot"
          git config user.email "actions@github.com"

          git add last_hash.txt

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
            exit 0
          fi

          git commit -m "Update IELTS monitor state"
          git push
